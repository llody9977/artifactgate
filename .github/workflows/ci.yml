name: CI Scan

env:
  TEST_IMAGE: n8nio/n8n@sha256:4e9de05de2f87c34774d71a93dd9aca924adb930c4c7f2f7797b84fa93327be5
  TRACEE_HOST_PORT: "15678"
  TRACEE_CONTAINER_PORT: "5678"

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  config-scan:
    name: IaC Misconfiguration & Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: ShellCheck Scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck > /dev/null
          echo "Running ShellCheck on bash scripts..."
          shellcheck iac/n8n/install.sh iac/n8n/upgrade.sh .github/scripts/*.sh
          python3 .github/scripts/test_validate_compose.py

      - name: IaC Scan (Checkov)
        uses: bridgecrewio/checkov-action@7b972723c44fb3d256283fac96fae5d7c1894bb7 # master
        with:
          directory: iac/n8n
          quiet: true
          soft_fail: false

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy jq

      - name: Scan repo — IaC misconfigurations and secrets
        id: trivy-scan
        run: |
          # Generate JSON report for artifact (always saved, even on failure)
          trivy fs . \
            --scanners misconfig,secret \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --format json \
            --output trivy-iac-report.json \
            --exit-code 0   # don't exit here — gate below handles it

          # Generate human-readable table for the Job Summary
          trivy fs . \
            --scanners misconfig,secret \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --format table \
            --output trivy-iac-summary.txt \
            --exit-code 0

          # Write to GitHub Actions Job Summary (visible on the PR checks page)
          echo "## 🔍 IaC Misconfiguration & Secret Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scope:** \`CRITICAL\`, \`HIGH\` — unfixed only" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat trivy-iac-summary.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

          # Count findings for gate decision
          FINDINGS=$(jq '[.Results[]?.Misconfigurations//[], .Results[]?.Secrets//[]] | flatten | length' trivy-iac-report.json 2>/dev/null || echo 0)
          echo "findings=$FINDINGS" >> $GITHUB_OUTPUT

          if [ "$FINDINGS" -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **$FINDINGS finding(s) detected — download \`trivy-iac-report\` artifact for full details.**" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **No CRITICAL/HIGH findings detected.**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload IaC Scan Report (always available, even on failure)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-iac-report
          path: |
            trivy-iac-report.json
            trivy-iac-summary.txt

      - name: Gate — block merge if findings detected
        if: steps.trivy-scan.outputs.findings != '0'
        run: |
          echo "❌ Trivy found CRITICAL/HIGH misconfigurations or secrets."
          echo "   Download the 'trivy-iac-report' artifact from this run for details."
          echo "   Fix all findings in the source files and push again."
          exit 1

  tracee-reachability-test:
    name: Tracee Reachability Integration Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install Trivy and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release jq curl
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy

      - name: Prepare Tracee helper scripts
        run: |
          chmod +x .github/scripts/collect_package_files.sh .github/scripts/run_tracee_reachability.sh .github/scripts/test_tracee_merge.sh

      - name: Verify Tracee merge fixture
        run: |
          .github/scripts/test_tracee_merge.sh

      - name: Pull test image
        run: |
          docker pull "${{ env.TEST_IMAGE }}"

      - name: Run Trivy image scan
        run: |
          trivy image \
            --format json \
            --output trivy-report.raw.json \
            --severity CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN \
            "${{ env.TEST_IMAGE }}"

      - name: Collect vulnerable package file map
        run: |
          .github/scripts/collect_package_files.sh "${{ env.TEST_IMAGE }}" trivy-report.raw.json package-files.tsv

      - name: Run Tracee reachability smoke test & OWASP ZAP DAST scan
        run: |
          .github/scripts/run_tracee_reachability.sh "${{ env.TEST_IMAGE }}" "$PWD/tracee-output" tracee-ci-smoke "${{ env.TRACEE_HOST_PORT }}" "${{ env.TRACEE_CONTAINER_PORT }}"
          if [ -f tracee-output/zap-report.html ]; then
            echo "✅ OWASP ZAP DAST scan completed successfully. Report saved at tracee-output/zap-report.html"
          else
            echo "⚠️ OWASP ZAP DAST scan did not generate a report."
          fi

      - name: Merge Tracee reachability into scan report
        run: |
          python3 .github/scripts/merge_tracee_reachability.py \
            trivy-report.raw.json \
            package-files.tsv \
            tracee-output/tracee-events.jsonl \
            "$(cat tracee-output/target-container-id.txt)" \
            trivy-report.tracee.json

      - name: Enrich report with KEV and EPSS
        run: |
          curl --fail --show-error --location --retry 3 -o kev.json https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
          python3 .github/scripts/enrich_findings.py trivy-report.tracee.json kev.json trivy-report.enriched.json

      - name: Verify summary and reachability fields
        run: |
          python3 .github/scripts/generate_summary.py trivy-report.enriched.json kev.json ci-tracee-test

          jq -e '.RuntimeObservationSummary.matched_event_count > 0' trivy-report.tracee.json > /dev/null
          jq -e '[.Results[]?.Vulnerabilities[]? | has("RuntimeObserved")] | all' trivy-report.enriched.json > /dev/null
          jq -e '[.Results[]?.Vulnerabilities[]? | .RuntimeObservation] | length > 0 and all(. == "Observed" or . == "Not observed" or . == "Unknown")' trivy-report.enriched.json > /dev/null
          grep -q "Runtime Obs." "$GITHUB_STEP_SUMMARY"

      - name: Upload Tracee integration artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tracee-reachability-integration
          path: |
            trivy-report.raw.json
            trivy-report.tracee.json
            trivy-report.enriched.json
            package-files.tsv
            kev.json
            tracee-output/

  cis-compliance-check:
    name: Container Hardening Profile Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Validate the rendered container hardening profile
        run: |
          export GITHUB_REPOSITORY_OWNER_LC=llody9977
          export REPOSITORY_NAME=artifactgate
          export HOST_IP=127.0.0.1
          export PUBLIC_BASE_URL=https://n8n.example.com/
          export N8N_HOST_PORT=5678
          export N8N_CONTAINER_PORT=5678
          export N8N_RUNNERS_BROKER_PORT=5679
          export N8N_RUNNERS_AUTH_TOKEN=test
          export N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT=15
          export N8N_IMAGE_IDENTIFIER=@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          export N8N_RUNNERS_IMAGE_IDENTIFIER=@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          export N8N_IMAGE_VERSION=0.0.0
          docker compose -f iac/n8n/docker-compose.yml config --format json > compose-rendered.json
          python3 .github/scripts/validate_compose.py compose-rendered.json | tee cis-compliance-report.txt
      - name: Upload hardening profile report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-hardening-report
          path: cis-compliance-report.txt
