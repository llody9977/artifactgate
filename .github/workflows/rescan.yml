name: Continuous Re-Scan (Image Lifecycle)

env:
  TRACEE_HOST_PORT: '15679'
  TRACEE_CONTAINER_PORT: '5678'

# Runs weekly to detect when the latest promoted image becomes ineligible under
# the current age/KEV/EPSS promotion policy.
on:
  schedule:
    - cron: '0 0 * * 1'   # Every Monday at 00:00 UTC
  workflow_dispatch:        # Allow manual trigger for ad-hoc re-scanning

jobs:
  rescan:
    name: Re-Scan Promoted Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      issues: write         # Needed to open alert issues
      security-events: write
    outputs:
      scanned_versions: ${{ steps.rescan.outputs.scanned_versions }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release jq
          # Install Cosign
          COSIGN_VERSION=v2.4.1
          curl --fail --show-error --location --retry 3 -o cosign "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          sudo install -m 755 cosign /usr/local/bin/cosign
          # Install Trivy
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq && sudo apt-get install -y trivy

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download CISA KEV catalogue
        run: |
          curl --fail --show-error --location --retry 3 -o kev.json https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
          jq -e '.vulnerabilities | type == "array" and length > 1000' kev.json >/dev/null
          echo "KEV catalogue downloaded: $(jq '.count' kev.json) entries"

      - name: Fetch latest promoted release and re-scan
        id: rescan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ALERT_BODY=""
          ALERT_FOUND=false
          mkdir -p sarifs
          SCANNED_TAGS=""

          # Resolve the latest promoted GitHub Release in this repo
          LATEST_TAG=$(gh release list \
            --repo ${{ github.repository }} \
            --limit 20 \
            --json tagName \
            --jq '[.[].tagName | select(startswith("n8n-"))] | sort_by(sub("^n8n-"; "") | split(".") | map(tonumber)) | last // ""')

          if [ -z "$LATEST_TAG" ]; then
            echo "No releases found."
            echo "scanned_versions=[]" >> $GITHUB_OUTPUT
            echo "alert_found=false" >> $GITHUB_OUTPUT
            echo "alert_body<<EOF" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Write the master summary header
          echo "## 🛡️ Weekly Re-Scan Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Latest promoted release in scope: \`$LATEST_TAG\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Version | CRITICAL | HIGH | MEDIUM | LOW/UNKNOWN | Manual Review | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: | :---: | :---: | :---: | :---: | :---: |" >> $GITHUB_STEP_SUMMARY

          # Extract version from tag like 'n8n-1.55.3' -> '1.55.3'
          VERSION=$(echo "$LATEST_TAG" | sed 's/^n8n-//')
          if [ -z "$VERSION" ]; then
            echo "Latest release tag '$LATEST_TAG' is not a valid n8n tag."
            echo "scanned_versions=[]" >> $GITHUB_OUTPUT
            echo "alert_found=false" >> $GITHUB_OUTPUT
            echo "alert_body<<EOF" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            exit 0
          fi

          WAIVER_EXPIRED=false
          mkdir -p "waiver-$VERSION"
          if gh release download "$LATEST_TAG" --repo "${{ github.repository }}" \
               --pattern waiver.json --dir "waiver-$VERSION" 2>/dev/null; then
            WAIVER_EXPIRY=$(jq -er '.expires_on' "waiver-$VERSION/waiver.json")
            if [ "$(date -u -d "$WAIVER_EXPIRY" +%s 2>/dev/null || echo 0)" -le "$(date -u +%s)" ]; then
              WAIVER_EXPIRED=true
            fi
          fi

          echo "--- Re-scanning latest promoted image n8n-trusted for $VERSION ---"

          IMAGE="ghcr.io/${{ github.repository }}/n8n-trusted:$VERSION"
          RUNNER_IMAGE="ghcr.io/${{ github.repository }}/n8n-runners-trusted:$VERSION"

          # Extract immutable digests directly from verified OCI decision attestation
          COSIGN_ID="https://github.com/${{ github.repository }}/.github/workflows/image-promotion.yml@refs/heads/main"
          COSIGN_ISS="https://token.actions.githubusercontent.com"
          APP_DEC_RAW=$(cosign verify-attestation --type promotiondecision --certificate-identity="$COSIGN_ID" --certificate-oidc-issuer="$COSIGN_ISS" "$IMAGE" 2>/dev/null || true)
          if [ -n "$APP_DEC_RAW" ]; then
            APP_DIG=$(echo "$APP_DEC_RAW" | jq -r 'if type=="array" then .[0].payload else .payload end' | base64 -d 2>/dev/null | jq -r '.predicate.application.promotedDigest // empty')
            RUN_DIG=$(echo "$APP_DEC_RAW" | jq -r 'if type=="array" then .[0].payload else .payload end' | base64 -d 2>/dev/null | jq -r '.predicate.runner.promotedDigest // empty')
            if [ -n "$APP_DIG" ] && [ -n "$RUN_DIG" ]; then
              IMAGE="ghcr.io/${{ github.repository }}/n8n-trusted@$APP_DIG"
              RUNNER_IMAGE="ghcr.io/${{ github.repository }}/n8n-runners-trusted@$RUN_DIG"
              echo "✅ Resolved immutable digests from OCI decision attestation: $APP_DIG"
            fi
          fi

          if ! docker pull "$IMAGE" > /dev/null 2>&1; then
            echo "❌ CRITICAL ERROR: Could not pull promoted image $IMAGE; failing closed."
            exit 1
          fi
          if ! docker pull "$RUNNER_IMAGE" > /dev/null 2>&1; then
            echo "❌ CRITICAL ERROR: Could not pull required promoted runner $RUNNER_IMAGE; failing closed."
            exit 1
          fi

          # Full image scan — same method as image-promotion for consistent results
          trivy image \
            --format json \
            --output "rescan-$VERSION.raw.json" \
            --severity CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN \
            --scanners vuln,license \
            "$IMAGE" || true
          trivy image --format json --output "rescan-$VERSION.runner.json" \
            --severity CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN \
            --scanners vuln,license \
            "$RUNNER_IMAGE"

          trivy image \
            --format sarif \
            --output "sarifs/rescan-$VERSION.sarif" \
            --severity CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN \
            "$IMAGE" || true

          # Record this version was successfully scanned
          SCANNED_TAGS="$VERSION"

          chmod +x .github/scripts/collect_package_files.sh .github/scripts/run_tracee_reachability.sh
          mkdir -p "tracee-$VERSION"
          .github/scripts/collect_package_files.sh "$IMAGE" "rescan-$VERSION.raw.json" "tracee-$VERSION/package-files.tsv"
          .github/scripts/run_tracee_reachability.sh "$IMAGE" "$PWD/tracee-$VERSION" "tracee-rescan-$VERSION-${{ github.run_id }}" "${{ env.TRACEE_HOST_PORT }}" "${{ env.TRACEE_CONTAINER_PORT }}"
          if [ -f "tracee-$VERSION/zap-report.html" ]; then
            echo "✅ OWASP ZAP DAST scan completed successfully. Report saved at tracee-$VERSION/zap-report.html"
          else
            echo "⚠️ OWASP ZAP DAST scan did not generate a report."
          fi
          python3 .github/scripts/merge_tracee_reachability.py \
            "rescan-$VERSION.raw.json" \
            "tracee-$VERSION/package-files.tsv" \
            "tracee-$VERSION/tracee-events.jsonl" \
            "$(cat "tracee-$VERSION/target-container-id.txt")" \
            "rescan-$VERSION.tracee.json"
          jq '(.Results[]? | .Target) |= ("n8n-runners:" + .) |
              (.Results[]?.Vulnerabilities[]? | .RuntimeObserved)=null |
              (.Results[]?.Vulnerabilities[]? | .RuntimeObservation)="Unknown" |
              (.Results[]?.Vulnerabilities[]? | .ReachabilityEvidence)=[]' \
              "rescan-$VERSION.runner.json" > "rescan-$VERSION.runner.annotated.json"
          jq -s '.[0].Results += (.[1].Results // []) | .[0]' \
              "rescan-$VERSION.tracee.json" "rescan-$VERSION.runner.annotated.json" \
              > "rescan-$VERSION.combined.json"
          mv "rescan-$VERSION.combined.json" "rescan-$VERSION.tracee.json"
          export ZAP_REPORT_FILE="tracee-$VERSION/zap-report.json"
          python3 .github/scripts/enrich_findings.py "rescan-$VERSION.tracee.json" kev.json "rescan-$VERSION.json"

          # Count findings by severity
          CRIT_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' "rescan-$VERSION.json" 2>/dev/null || echo 0)
          HIGH_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' "rescan-$VERSION.json" 2>/dev/null || echo 0)
          MED_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' "rescan-$VERSION.json" 2>/dev/null || echo 0)
          LOW_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="LOW" or .Severity=="UNKNOWN")] | length' "rescan-$VERSION.json" 2>/dev/null || echo 0)
          MANUAL_REVIEW_COUNT=$(jq -r '.AnalysisSummary.manual_review_count // 0' "rescan-$VERSION.json")
          AUTO_ELIGIBLE_COUNT=$(jq -r '.AnalysisSummary.auto_allowed_critical_high_count // 0' "rescan-$VERSION.json")
          AGE_REVIEW_COUNT=$(jq -r '.AnalysisSummary.older_than_30_days_count // 0' "rescan-$VERSION.json")
          KEV_REVIEW_COUNT=$(jq -r '.AnalysisSummary.kev_critical_high_count // 0' "rescan-$VERSION.json")
          EPSS_REVIEW_COUNT=$(jq -r '.AnalysisSummary.epss_high_or_critical_count // 0' "rescan-$VERSION.json")
          UNKNOWN_AGE_REVIEW_COUNT=$(jq -r '.AnalysisSummary.unknown_age_critical_high_count // 0' "rescan-$VERSION.json")

          # Overview table row
          if [ "$MANUAL_REVIEW_COUNT" -gt 0 ] || [ "$WAIVER_EXPIRED" = true ]; then
            STATUS="🟠 Manual Review"
          elif [ "$AUTO_ELIGIBLE_COUNT" -gt 0 ]; then
            STATUS="✅ Auto Eligible"
          else
            STATUS="✅ Clean"
          fi
          echo "| $VERSION | $CRIT_COUNT | $HIGH_COUNT | $MED_COUNT | $LOW_COUNT | $MANUAL_REVIEW_COUNT | $STATUS |" >> $GITHUB_STEP_SUMMARY

          # Per-version detailed vulnerability section
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python3 .github/scripts/generate_summary.py "rescan-$VERSION.json" kev.json "$VERSION" || true

          # Escalate if alert condition triggers
          if [ "$MANUAL_REVIEW_COUNT" -gt 0 ] || [ "$WAIVER_EXPIRED" = true ]; then
            ALERT_FOUND=true
            ALERT_BODY="$ALERT_BODY\n\n### \`n8n-trusted:$VERSION\`\n"
            [ "$MANUAL_REVIEW_COUNT" -gt 0 ] && ALERT_BODY="$ALERT_BODY- 🟠 **$MANUAL_REVIEW_COUNT finding(s)** now require manual review under the promotion gate\n"
            [ "$AGE_REVIEW_COUNT" -gt 0 ] && ALERT_BODY="$ALERT_BODY- ⏱️ **$AGE_REVIEW_COUNT** critical/high CVE(s) are now at least 30 days old\n"
            [ "$KEV_REVIEW_COUNT" -gt 0 ] && ALERT_BODY="$ALERT_BODY- 🚨 **$KEV_REVIEW_COUNT** critical/high CVE(s) now match KEV\n"
            [ "$EPSS_REVIEW_COUNT" -gt 0 ] && ALERT_BODY="$ALERT_BODY- 📈 **$EPSS_REVIEW_COUNT** critical/high CVE(s) are now EPSS HIGH/CRITICAL\n"
            [ "$UNKNOWN_AGE_REVIEW_COUNT" -gt 0 ] && ALERT_BODY="$ALERT_BODY- ❓ **$UNKNOWN_AGE_REVIEW_COUNT** critical/high CVE(s) have unknown published dates\n"
            [ "$WAIVER_EXPIRED" = true ] && ALERT_BODY="$ALERT_BODY- ⌛ The attached promotion waiver has expired\n"
            echo "  ⚠️  Alert triggered for $VERSION"

            jq -n \
              --arg ver "$VERSION" \
              --arg appdig "${APP_DIG:-unknown}" \
              --arg rundig "${RUN_DIG:-unknown}" \
              '{
                schemaVersion: "1.0",
                status: "REVOKED",
                reason: "Security decay: promoted image no longer satisfies policy thresholds without active waiver",
                revokedAt: (now | strftime("%Y-%m-%dT%H:%M:%SZ")),
                targetVersion: $ver,
                applicationDigest: $appdig,
                runnerDigest: $rundig
              }' > revocation-decision.json
            echo "🚨 Generated revocation decision predicate: revocation-decision.json"
          else
            echo "  ✅ $VERSION remains auto-eligible"
          fi


          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # Build JSON array of successfully scanned versions
          SCANNED_VERSIONS_JSON=$(echo "$SCANNED_TAGS" | tr ' ' '\n' | grep -v '^$' | jq -R . | jq -s -c .)
          echo "scanned_versions=$SCANNED_VERSIONS_JSON" >> $GITHUB_OUTPUT

          echo "alert_found=$ALERT_FOUND" >> $GITHUB_OUTPUT
          echo "alert_body<<EOF_ALERT" >> $GITHUB_OUTPUT
          echo -e "$ALERT_BODY" >> $GITHUB_OUTPUT
          echo "EOF_ALERT" >> $GITHUB_OUTPUT

      - name: Open GitHub Issue if new findings detected
        if: steps.rescan.outputs.alert_found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALERT_BODY: ${{ steps.rescan.outputs.alert_body }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          printf "## Weekly Re-Scan Alert\n\nOne or more previously promoted images are now **ineligible under the current age/KEV/EPSS promotion gate**.\n\n**Action required**: Review the findings below and decide whether to:\n1. Promote a newer clean version via the Image Promotion pipeline\n2. Revoke the affected image from deployment (update \`N8N_IMAGE_IDENTIFIER\` on hosts)\n\n%b\n\n---\n👉 [View Full Vulnerability Details (Workflow Run)](%s)\n\n*Triggered by the weekly re-scan job on %s*\n" "$ALERT_BODY" "$RUN_URL" "$(date -u '+%Y-%m-%d')" > issue_body.md

          gh label create security --color "FF0000" --force || true

          gh issue create \
            --repo "${{ github.repository }}" \
            --title "🚨 Re-Scan Alert: promoted image(s) now require manual review" \
            --body-file issue_body.md \
            --label "security"

      - name: Upload Trivy scan results to GitHub Security tab
        if: always() && steps.rescan.outputs.version != ''
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        with:
          sarif_file: "sarifs/rescan-${{ steps.rescan.outputs.version }}.sarif"
          category: "rescan-${{ steps.rescan.outputs.version }}"

      - name: Upload SARIFs as internal artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sarif-files
          path: sarifs/
          if-no-files-found: ignore
