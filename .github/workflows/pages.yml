name: Deploy evidence page

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI Scan, Image Promotion (Trusted Source), Continuous Re-Scan (Image Lifecycle)]
    types: [completed]

permissions: {}
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Generate current public evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest")
          printf '%s' "$release" | jq '{tag_name,published_at,html_url,name,body}' > site/evidence.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
